name: CI/CD Backend Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-test:
    name: Code Integration & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run automated tests
        run: npm test || true

  build-and-push:
    name: Build & Push Docker Image
    needs: ci-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Short Commit Hash
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-mobile-app:${{ steps.vars.outputs.sha_short }}

  deploy:
    name: Deploy to OpenStack VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Cài đặt cloudflared client trên runner
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: SSH qua Cloudflare Tunnel và Deploy container
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          # 1. Khởi tạo thư mục SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 2. Lưu private key
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 3. Tạo file cấu hình SSH với ProxyCommand gọi cloudflared
          cat <<EOF > ~/.ssh/config
          Host $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id $CF_CLIENT_ID --secret $CF_CLIENT_SECRET
            StrictHostKeyChecking no
          EOF

          # 4. Thực thi SSH và chạy script trên máy đích (Đã sửa bỏ nháy đơn ở EOF_SSH)
          ssh $SERVER_HOST << EOF_SSH
            # Di chuyển vào thư mục dự án trên VM
            cd /home/ubuntu/Backend_mobile-app
            
            echo "Đang triển khai phiên bản hash: ${NEW_TAG}"
            
            # Kéo Docker image có hash mới nhất
            docker pull ${DOCKER_USER}/backend-mobile-app:${NEW_TAG}
            
            # Cập nhật biến môi trường IMAGE_TAG trong file .env cho docker-compose
            if grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${NEW_TAG}/" .env
            else
              echo "IMAGE_TAG=${NEW_TAG}" >> .env
            fi
            
            # Khởi động lại container với image mới
            IMAGE_TAG=${NEW_TAG} docker compose up -d --remove-orphans
            
            # Dọn dẹp image cũ
            docker image prune -f
          EOF_SSH