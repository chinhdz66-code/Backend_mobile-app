version: '3.8'

services:
  backend:
    # Thay khối build bằng image từ Docker Hub kèm biến động IMAGE_TAG
    # Cú pháp ${IMAGE_TAG:-latest} giúp fallback về 'latest' nếu biến IMAGE_TAG chưa được set
    image: chausu/backend-mobile-app:${IMAGE_TAG:-latest}
    container_name: backend-api
    restart: unless-stopped
    expose:
      - "8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge